name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

# CI 只需要读代码，显式收窄默认权限
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Build debug APK
        # 跳过 lintVitalRelease：本机 Windows + AGP 8.7.2 下该任务长时间无进展（实测卡死），
        # CI 一并跳过，避免流水线无意义地空转。
        # 没有 app/google-services.json 也能构建：插件按文件是否存在决定是否启用。
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -x lintVitalRelease --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: otsmail-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
