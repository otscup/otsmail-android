name: Android Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（仅用于产物命名；dry-run 不创建 Release）'
        required: false
        default: '0.2.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/otsmail-release.jks"
          test -s "$RUNNER_TEMP/otsmail-release.jks"

      - name: Decode google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          test -s app/google-services.json

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/otsmail-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -x lintVitalRelease --console=plain

      - name: Verify signature and package
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$SDK/build-tools/$BT/apksigner" verify --print-certs "$APK"
          "$SDK/build-tools/$BT/aapt" dump badging "$APK" | head -3
          sha256sum "$APK"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "otsmail-${{ steps.ver.outputs.value }}-release.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otsmail-release
          path: otsmail-${{ steps.ver.outputs.value }}-release.apk
          if-no-files-found: error

      # 只有 tag push 才建正式 Release；workflow_dispatch 只出 artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="otsmail-${{ steps.ver.outputs.value }}-release.apk"
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "OTSMail Android ${{ steps.ver.outputs.value }}" \
            --notes "正式签名包，可直接覆盖升级。SHA-256：\`$(sha256sum "$ASSET" | cut -d' ' -f1)\`"
