name: Android Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（X.Y.Z；workflow_dispatch 只出 artifact，不建 Release）'
        # 不设默认值：任何写死的默认号都会随版本推进过期（0.2.4 就是这样误发过），
        # 手动档要求显式填写，宁可多敲一次，也不让默认值把包发错。
        required: true

# 默认只读：只有 release job 需要写权限，避免其它步骤（构建/测试）拿到 contents: write
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 并上传资产

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # 版本号必须来自 tag：构建前先解析，并强校验格式，避免包内版本和 tag 脱钩
      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            V="${V#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须是 X.Y.Z（收到 '$V'）"
            exit 1
          fi
          # 规则：major*10000 + minor*100 + patch，只升不降（0.2.4 -> 204，0.3.0 -> 300）
          CODE=$(( $(echo "$V" | cut -d. -f1) * 10000 + $(echo "$V" | cut -d. -f2) * 100 + $(echo "$V" | cut -d. -f3) ))
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "构建版本：$V ($CODE)"

      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/otsmail-release.jks"
          test -s "$RUNNER_TEMP/otsmail-release.jks"

      - name: Decode google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          test -s app/google-services.json

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/otsmail-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -x lintVitalRelease --console=plain \
            -PversionName="${{ steps.ver.outputs.value }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      # 断言「包内版本 == tag 版本」「versionCode == 规则计算值」，不一致直接失败
      - name: Verify signature and version match tag
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$SDK/build-tools/$BT/apksigner" verify --print-certs "$APK"
          BADGING=$("$SDK/build-tools/$BT/aapt" dump badging "$APK" | head -1)
          NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          echo "$BADGING"
          if [ "$NAME" != "${{ steps.ver.outputs.value }}" ]; then
            echo "::error::包内 versionName=$NAME，与 tag 版本 ${{ steps.ver.outputs.value }} 不一致"
            exit 1
          fi
          if [ "$CODE" != "${{ steps.ver.outputs.code }}" ]; then
            echo "::error::包内 versionCode=$CODE，按规则应为 ${{ steps.ver.outputs.code }}"
            exit 1
          fi
          sha256sum "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "otsmail-${{ steps.ver.outputs.value }}-release.apk"

      # R8 混淆映射与 APK 必须一起归档：没有它，线上崩溃堆栈里的 a.a.a 永远还原不回人类可读符号。
      # 文件缺失就直接失败，不允许「静默发一个没有 mapping 的版本」。
      - name: Stage R8 mapping
        shell: bash
        run: |
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          if [ ! -s "$MAPPING" ]; then
            echo "::error::缺少 $MAPPING：release 变体的 R8 映射没有产出，拒绝发布"
            exit 1
          fi
          cp "$MAPPING" "mapping-v${{ steps.ver.outputs.value }}.txt"
          echo "映射文件：mapping-v${{ steps.ver.outputs.value }}.txt"
          sha256sum "mapping-v${{ steps.ver.outputs.value }}.txt"
          wc -l "mapping-v${{ steps.ver.outputs.value }}.txt"

      # 发版正文的初稿由提交记录生成，但允许人工编辑：
      # 若仓库里存在 docs/release-notes/<版本>.md，就以它为准（发版前提交这个文件即可覆盖初稿）；
      # 否则按 feat/fix 前缀分组生成，并保留「已知问题 / 安装提示 / 未真机验证」三个必填段落。
      - name: Build structured release notes
        id: notes
        shell: bash
        run: |
          V="${{ steps.ver.outputs.value }}"
          NOTE_FILE="release-notes.md"
          if [ -f "docs/release-notes/$V.md" ]; then
            cp "docs/release-notes/$V.md" "$NOTE_FILE"
            echo "使用人工编辑的 docs/release-notes/$V.md"
          else
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE=""; fi
            git log $RANGE --no-merges --pretty=%s > "$RUNNER_TEMP/commits.txt"
            {
              echo "## 新增功能"
              grep -E '^(feat|功能)' "$RUNNER_TEMP/commits.txt" | sed 's/^/- /' || true
              echo ""
              echo "## 修复"
              grep -E '^(fix|bugfix|修复)' "$RUNNER_TEMP/commits.txt" | sed 's/^/- /' || true
              echo ""
              echo "## 其它变更"
              grep -Ev '^(feat|fix|bugfix|功能|修复)' "$RUNNER_TEMP/commits.txt" | sed 's/^/- /' || true
              echo ""
              echo "## 已知问题"
              echo "- 待补充：发版前请编辑本段，或提交 docs/release-notes/$V.md 覆盖初稿。"
              echo ""
              echo "## 安装提示"
              echo "- 同签名可直接覆盖安装；覆盖后如通知、相机等权限被系统重置，请在设置里重新授予。"
              echo "- 回退旧版需要先卸载，本地邮件缓存会清空。"
              echo ""
              echo "## 本版仍未经真机验证的项"
              echo "- 待补充：发版前必须写明本版未在真机验证的功能。"
            } > "$NOTE_FILE"
            echo "根据提交记录生成初稿，可在 docs/release-notes/$V.md 中人工修订"
          fi
          test -s "$NOTE_FILE"
          # 结构化正文是硬要求：五个段落缺一个就判红，避免又退回成一整段文字
          for S in "## 新增功能" "## 修复" "## 已知问题" "## 安装提示" "## 本版仍未经真机验证的项"; do
            if ! grep -qF "$S" "$NOTE_FILE"; then
              echo "::error::发布说明缺少段落：$S"
              exit 1
            fi
          done
          echo "--- release-notes.md ---"
          cat "$NOTE_FILE"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: otsmail-release
          path: |
            otsmail-${{ steps.ver.outputs.value }}-release.apk
            mapping-v${{ steps.ver.outputs.value }}.txt
          if-no-files-found: error
          # 90 是公开仓库允许的保留上限：Release 附件随版本清理，artifact 兜住最近 90 天的映射
          retention-days: 90

      # 只有 tag push 才建正式 Release；workflow_dispatch 只出 artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="otsmail-${{ steps.ver.outputs.value }}-release.apk"
          MAPPING="mapping-v${{ steps.ver.outputs.value }}.txt"
          {
            echo ""
            echo "正式签名包，可直接覆盖升级。SHA-256：\`$(sha256sum "$ASSET" | cut -d' ' -f1)\`"
            echo ""
            echo "该版本的 R8 混淆映射不随 Release 公开，仅归档在本次 Actions artifact（保留 90 天，文件名 \`$MAPPING\`）。"
          } >> release-notes.md
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "OTSMail Android ${{ steps.ver.outputs.value }}" \
            --notes-file release-notes.md

      # 发版后保留最近 3 个 Release（按版本号排序删更旧的），远端 tag 一律不动。
      # 删 Release 会连带删除它挂的 asset（只含 APK）；映射不挂 Release，只存在 90 天的 artifact。
      # tag 保留才能追溯历史、按 tag 重新构建。
      # 该删没删掉的逐条给出 ::warning::，不留静默失败；这一步本身不判红，避免清理问题阻断发布。
      - name: Clean up older releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="$GITHUB_REF_NAME"
          KEEP=3
          # 保护性匹配：本次 tag 必须是 vX.Y.Z；不合规就不清理，避免误删自定义 tag
          if ! [[ "$CURRENT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "当前 tag '$CURRENT' 不是 vX.Y.Z 形态，跳过清理"
            exit 0
          fi
          # 列表为空也不报错，直接跳过
          if ! TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>&1); then
            echo "::warning::读取 Release 列表失败，跳过清理：$TAGS"
            exit 0
          fi
          # 只接受 vX.Y.Z；其余名字（预发布/自定义 tag）一律跳过并打印原因
          VALID=()
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VALID+=("$TAG")
            else
              echo "跳过非版本号 Release：$TAG"
            fi
          done <<< "$TAGS"
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "没有 vX.Y.Z 形态的 Release，跳过清理"
            exit 0
          fi
          # 按版本号降序；最近 KEEP 个保留，当前版本无论排第几都不删
          mapfile -t SORTED < <(printf '%s\n' "${VALID[@]}" | sort -V -r)
          KEPT=0
          FAILED=0
          for TAG in "${SORTED[@]}"; do
            if [ "$TAG" = "$CURRENT" ]; then
              echo "保留当前发布版本：$TAG"
              KEPT=$((KEPT + 1))
              continue
            fi
            if [ "$KEPT" -lt "$KEEP" ]; then
              echo "保留（最近 $KEEP 个之一）：$TAG"
              KEPT=$((KEPT + 1))
              continue
            fi
            if gh release delete "$TAG" --yes; then
              echo "已删除旧 Release：$TAG（远端 tag 保留）"
            else
              FAILED=$((FAILED + 1))
              echo "::warning::删除旧 Release 失败：$TAG（保留 tag，可直接重试）"
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::本轮有 $FAILED 个旧 Release 未删除成功，请检查上方逐条结果"
          else
            echo "清理完成：保留最近 $KEEP 个 Release，未删除任何 tag"
          fi
