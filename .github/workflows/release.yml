name: Android Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（X.Y.Z；workflow_dispatch 只出 artifact，不建 Release）'
        required: false
        default: '0.2.4'

# 默认只读：只有 release job 需要写权限，避免其它步骤（构建/测试）拿到 contents: write
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 并上传资产

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # 版本号必须来自 tag：构建前先解析，并强校验格式，避免包内版本和 tag 脱钩
      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            V="${V#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须是 X.Y.Z（收到 '$V'）"
            exit 1
          fi
          # 规则：major*10000 + minor*100 + patch，只升不降（0.2.4 -> 204，0.3.0 -> 300）
          CODE=$(( $(echo "$V" | cut -d. -f1) * 10000 + $(echo "$V" | cut -d. -f2) * 100 + $(echo "$V" | cut -d. -f3) ))
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "构建版本：$V ($CODE)"

      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/otsmail-release.jks"
          test -s "$RUNNER_TEMP/otsmail-release.jks"

      - name: Decode google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          test -s app/google-services.json

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/otsmail-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -x lintVitalRelease --console=plain \
            -PversionName="${{ steps.ver.outputs.value }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      # 断言「包内版本 == tag 版本」「versionCode == 规则计算值」，不一致直接失败
      - name: Verify signature and version match tag
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$SDK/build-tools/$BT/apksigner" verify --print-certs "$APK"
          BADGING=$("$SDK/build-tools/$BT/aapt" dump badging "$APK" | head -1)
          NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          echo "$BADGING"
          if [ "$NAME" != "${{ steps.ver.outputs.value }}" ]; then
            echo "::error::包内 versionName=$NAME，与 tag 版本 ${{ steps.ver.outputs.value }} 不一致"
            exit 1
          fi
          if [ "$CODE" != "${{ steps.ver.outputs.code }}" ]; then
            echo "::error::包内 versionCode=$CODE，按规则应为 ${{ steps.ver.outputs.code }}"
            exit 1
          fi
          sha256sum "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "otsmail-${{ steps.ver.outputs.value }}-release.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: otsmail-release
          path: otsmail-${{ steps.ver.outputs.value }}-release.apk
          if-no-files-found: error

      # 只有 tag push 才建正式 Release；workflow_dispatch 只出 artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="otsmail-${{ steps.ver.outputs.value }}-release.apk"
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "OTSMail Android ${{ steps.ver.outputs.value }}" \
            --notes "正式签名包，可直接覆盖升级。SHA-256：\`$(sha256sum "$ASSET" | cut -d' ' -f1)\`"

      # 本次 Release 成功创建之后才清理旧版本，保证仓库里只留当前 tag 这一个 Release。
      # continue-on-error：删旧失败（权限/限流/tag 已不存在）只记日志，不影响本次发布、不让 workflow 变红。
      - name: Clean up older releases
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="$GITHUB_REF_NAME"
          # 保护性匹配：本次 tag 必须是 vX.Y.Z；不合规就不清理，避免误删自定义 tag
          if ! [[ "$CURRENT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "当前 tag '$CURRENT' 不是 vX.Y.Z 形态，跳过清理"
            exit 0
          fi
          # 列表为空也不报错，直接跳过
          TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          if [ -z "$TAGS" ]; then
            echo "远端没有其它 Release，跳过清理"
            exit 0
          fi
          for TAG in $TAGS; do
            # 只删 vX.Y.Z，且绝不删刚发布的这个
            if [ "$TAG" = "$CURRENT" ]; then
              continue
            fi
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "跳过非版本号 Release：$TAG"
              continue
            fi
            echo "删除旧 Release：$TAG"
            gh release delete "$TAG" --yes || echo "删除 Release $TAG 失败，跳过"
            # 连带删除远端 tag；已被删除时 git push 失败也无妨
            git push origin ":refs/tags/$TAG" 2>/dev/null || echo "远端 tag $TAG 不存在或删除失败，跳过"
          done
